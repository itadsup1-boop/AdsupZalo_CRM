[general]
static=yes
writeprotect=no

[agent-outbound]
exten => _X.,1,NoOp(Agent 101 dialing out: ${EXTEN})
 same => n,Hangup()

[zcc-outbound]
; Click-to-call: Originate routes here after agent answers
exten => _[0-9a-zA-Z].,1,NoOp(Originated Call to Zalo: ${EXTEN} for AppID: ${APP_ID} and OAID: ${OA_ID})
 same => n,Set(PJSIP_HEADER(update,From)=<sip:${OA_ID}@${APP_ID}.zcc.openapi.zaloapp.com>)
 same => n,Dial(PJSIP/zcc-trunk/sip:${EXTEN}@${APP_ID}.zcc.openapi.zaloapp.com:5060,30)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?ended)
 ; Fallback for local demo/testing when trunk is not registered
 same => n,NoOp(Trunk unavailable, falling back to local demo audio)
 same => n,Answer()
 same => n,Playback(demo-congrats)
 same => n,Echo()
 same => n(ended),Hangup()


