[global]
type=global
user_agent=Zalo CRM PBX

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_signaling_address=147.185.221.21:42586
external_media_address=147.185.221.21:42586
local_net=172.16.0.0/12
local_net=192.168.0.0/16
local_net=127.0.0.1/32

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

[zcc-trunk]
type=endpoint
transport=transport-udp
context=zcc-inbound
disallow=all
allow=ulaw,alaw
aors=zcc-aor
outbound_auth=
direct_media=no

[zcc-aor]
type=aor

; Agent Extension 101 for softphone (Zoiper / MicroSIP)
[101]
type=endpoint
transport=transport-tcp
context=agent-outbound
disallow=all
allow=ulaw,alaw
auth=101-auth
aors=101
direct_media=no

[101-auth]
type=auth
auth_type=userpass
username=101
password=crmagentpassword123

[101]
type=aor
max_contacts=5
